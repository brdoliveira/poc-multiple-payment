  <rect class="control" x="60" y="1200" width="1780" height="82"/>
  <text class="heading" x="90" y="1232">Ferramentas senior/transversais</text>
  <text class="small" x="90" y="1262">IAM roles por servico | Secrets Manager + KMS | CloudWatch Logs/Metrics/Alarms | X-Ray/OpenTelemetry | CloudTrail | Terraform | CI/CD com rollback | HPA/Auto Scaling | WAF/rate limit | DLQ + redrive + runbooks</text>
</svg>
