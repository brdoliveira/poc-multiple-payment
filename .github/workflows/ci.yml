name: ci

on:
  push:
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payment-orchestrator-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn test

  kotlin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pix-boleto-kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.8"
      - run: gradle test --no-daemon

  csharp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/card-payment-csharp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore --configfile NuGet.Config
      - run: dotnet test --no-restore

  docker-build:
    runs-on: ubuntu-latest
    needs: [java, kotlin, csharp]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  payment-flow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/payment-flow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/payment-flow/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  spec-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test .spec/static-tests/aws-terraform-payment-poc.test.mjs .spec/static-tests/payment-flow-screen.test.mjs .spec/static-tests/reliability-observability.test.mjs .spec/static-tests/github-actions-terraform-ci.test.mjs
