services:
  postgres:
    image: postgres:16
    container_name: poc-payment-postgres
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: poc-payment-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./infra/mongodb/init-payment-operational.js:/docker-entrypoint-initdb.d/init-payment-operational.js:ro

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: poc-payment-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres-data:
  mongo-data:
